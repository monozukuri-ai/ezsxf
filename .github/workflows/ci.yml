name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust-and-python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install maturin
        run: python -m pip install --upgrade pip maturin

      - name: Record native build environment
        run: |
          python -c "import os,platform,subprocess; info=subprocess.check_output(['rustc','-vV'],text=True); print(platform.platform()); print(info); assert os.name!='nt' or 'host: x86_64-pc-windows-msvc' in info"

      - name: Rust fmt
        run: cargo fmt --check

      - name: Rust clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test

      - name: Cargo package smoke test
        run: cargo package --allow-dirty --no-verify

      - name: Build extension
        run: |
          maturin build --out dist
          python -c "import pathlib,subprocess,sys; wheel=next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall',str(wheel)])"

      - name: Python tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: CLI smoke test
        run: |
          python -m ezsxf

      - name: Filesystem save verification
        run: python scripts/verify_sfc_platform.py --output platform-verification

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sfc-save-${{ matrix.os }}
          path: platform-verification
          if-no-files-found: ignore
