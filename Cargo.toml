[package]
name = "ezsxf"
version = "0.3.3"
edition = "2021"
rust-version = "1.88"
description = "Fast SXF parser, SFC writer and drawing converter for Python powered by Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/monozukuri-ai/ezsxf"
homepage = "https://github.com/monozukuri-ai/ezsxf"
keywords = ["sxf", "p21", "sfc", "cad", "parser"]
categories = ["parser-implementations", "encoding"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/src/*.rs",
    "/src/ezsxf/__init__.py",
    "/src/ezsxf/__main__.py",
    "/src/ezsxf/_drawing.py",
    "/src/ezsxf/_drawing_annotations.py",
    "/src/ezsxf/_drawing_builder.py",
    "/src/ezsxf/_drawing_geometry.py",
    "/src/ezsxf/_drawing_hatches.py",
    "/src/ezsxf/_drawing_style.py",
    "/src/ezsxf/_dxf.py",
    "/src/ezsxf/_plot.py",
    "/src/ezsxf/_p21_drawing.py",
    "/src/ezsxf/_core.pyi",
    "/src/ezsxf/py.typed",
    "/tests/test_python_api.py",
    "/tests/test_conversion.py",
    "/tests/test_sfc_writer.py",
    "/tests/test_sfc_bundle.py",
    "/tests/test_sfc_editor.py",
    "/tests/test_sfc_attributes.py",
    "/tests/test_sfc_complex_editor.py",
    "/tests/test_sfc_reexport_verification.py",
    "/tests/test_sfc_styles.py",
    "/tests/test_writer_requests.py",
    "/tests/test_writer_requests_v2.py",
    "/tests/test_p21_delivery.py",
    "/scripts/verify_writer_requests.py",
    "/scripts/verify_writer_requests_v2.py",
    "/scripts/verify_sfc_windows.ps1",
    "/scripts/verify_sfc_platform.py",
    "/scripts/verify_sfc_mvp.py",
    "/scripts/check_distribution.py",
    "/scripts/prepare_sfc_cad.py",
    "/scripts/prepare_sfc_display.py",
    "/scripts/prepare_sfc_reexport.py",
    "/scripts/verify_sfc_reexport.py",
    "/scripts/verify_sfc_cad_text.py",
    "/scripts/verify_sfc_cad_windows.ps1",
    "/docs/*.md",
    "/tests/fixtures/writer_all_features.sfc",
]

[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[dependencies]
# "extension-module" tells pyo3 we want to build an extension module (skips linking against libpython.so)
# "abi3-py39" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.9
encoding_rs = "0.8"
libc = "0.2"
roxmltree = "0.21"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
pyo3 = { version = "0.22.4", features = ["extension-module", "abi3-py39"] }
